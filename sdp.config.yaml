# sdp specifies itself; every key is described in specs/features/adopt/configure-a-workspace.feature.
features: ["specs/**/*.feature"]
code: ["src/**/*.ts"]
steps: ["specs/steps/**/*.steps.ts"]
# While the project is at its inception, specs are cut freely: check compares no live test with the git base.
base: none
# The guide runs the shop example and the vocabulary pin reads it, the guide reads the CI workflow, and packing builds
# with the build config and the pack scripts and ships the command and the skill: a change to any of them is a change
# to what they ran against.
evidence:
  inputs: [
    "examples/shop/specs/**", "examples/shop/src/**", "examples/shop/sdp.config.yaml", "examples/shop/tsconfig.json",
    ".github/workflows/**", "tsconfig.build.json", "bin/**", "scripts/pack/**", ".claude/skills/sdp/SKILL.md"
  ]
vocabulary:
  disciplines:
    # The guide's rules are tests of this repository, so one still to come is test work, planned as any other.
    test: [guide]
